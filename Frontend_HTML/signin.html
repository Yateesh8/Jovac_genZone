<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>genZone - Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header Bar: Hamburger + Theme Toggle -->
    <div class="header-bar">
      <!-- 🍔 Hamburger Menu Button -->
      <div class="hamburger-menu">
        <button id="hamburgerToggle">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>

      <!-- 🌗 Theme Toggle -->
      <div class="theme-toggle">
        <label class="switch">
          <span class="sun">
            <!-- SVG for sun (valid) -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="#ffd43b"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line
                x1="12"
                y1="1"
                x2="12"
                y2="3"
                stroke="#ffd43b"
                stroke-width="2"
              />
              <line
                x1="12"
                y1="21"
                x2="12"
                y2="23"
                stroke="#ffd43b"
                stroke-width="2"
              />
              <line
                x1="4.22"
                y1="4.22"
                x2="5.64"
                y2="5.64"
                stroke="#ffd43b"
                stroke-width="2"
              />
              <line
                x1="18.36"
                y1="18.36"
                x2="19.78"
                y2="19.78"
                stroke="#ffd43b"
                stroke-width="2"
              />
              <line
                x1="1"
                y1="12"
                x2="3"
                y2="12"
                stroke="#ffd43b"
                stroke-width="2"
              />
              <line
                x1="21"
                y1="12"
                x2="23"
                y2="12"
                stroke="#ffd43b"
                stroke-width="2"
              />
              <line
                x1="4.22"
                y1="19.78"
                x2="5.64"
                y2="18.36"
                stroke="#ffd43b"
                stroke-width="2"
              />
              <line
                x1="18.36"
                y1="5.64"
                x2="19.78"
                y2="4.22"
                stroke="#ffd43b"
                stroke-width="2"
              />
            </svg>
          </span>

          <span class="moon">
            <!-- SVG for moon (valid) -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="#ffd43b"
            >
              <path
                d="M21 12.79A9 9 0 0112.21 3a7 7 0 000 14 9 9 0 018.79-4.21z"
              ></path>
            </svg>
          </span>

          <input type="checkbox" class="input" id="themeToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="background-overlay"></div>

    <!-- Login Container -->
    <div class="container">
      <h1 class="brand">gen<span>Zone</span></h1>

      <form class="login-form">
        <input
          type="text"
          id="loginIdentifier"
          placeholder="Username / Email / Phone"
          required
        />
        <div class="password-wrapper">
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          />
          <button type="button" id="togglePassword">Show</button>
        </div>

        <button type="submit">Log In</button>
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </form>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
