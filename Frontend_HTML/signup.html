<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | genZone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Controls: Hamburger + Theme Toggle -->
  <div class="top-controls">
    <!-- Hamburger Icon -->
    <div class="hamburger">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <!-- Theme Toggle -->
    <div class="theme-toggle">
      <label class="switch">
        <span class="sun">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g fill="#ffd43b">
              <circle r="5" cy="12" cx="12"></circle>
              <path d="m21 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2z"/>
            </g>
          </svg>
        </span>
        <span class="moon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
            <path d="M223.5 32C100 32 0 132.3 0 256s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"/>
          </svg>
        </span>
        <input type="checkbox" class="input" id="themeToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <!-- Sign Up Form -->
  <div class="container">
    <div class="brand">gen<span>Zone</span></div>
    <form class="login-form" id="signupForm" autocomplete="off">
      <input type="text" id="fullName" placeholder="Full Name" required>
      <input type="text" id="username" placeholder="Username" required>
      <input type="text" id="contact" placeholder="Gmail / Phone" required>
      <input type="password" id="password" placeholder="Password" required minlength="6">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6">
      <button type="submit">Sign Up</button>
      <p>Already have an account? <a href="signin.html">Log In</a></p>
    </form>
  </div>
  <!-- External JS for all logic (theme & signup) -->
  <script src="script.js" defer></script>
</body>
</html>
